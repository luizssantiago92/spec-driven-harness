# Python preset
schema: spec-driven

branch_prefix: feat

chatprd_org_id: ""
# Secrets: set CHATPRD_ACCESS_TOKEN (preferred) or CHATPRD_API_KEY in the environment (never store tokens in this file).

context: |
  Stack: Python 3.10+
  Test command: pytest
  Lint: ruff check .
  Branch prefix: feat
  ChatPRD (optional): set chatprd_org_id above; MCP in Cursor or CHATPRD_ACCESS_TOKEN env for CLI pull

rules:
  specify:
    - Prefer EARS acceptance criteria
    - Mark unknowns with [NEEDS CLARIFICATION: question]
  tasks:
    - Every REQ must appear in the Test Coverage Matrix
    - Gate Check Commands must include pytest
  implement:
    - Run pytest before each commit
  verify:
    - Evidence must cite test file:line paths under tests/
