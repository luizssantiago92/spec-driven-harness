name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Verify skill file exists
        run: test -f skills/agent-architecture.md

      - name: Verify additional skills and rules exist
        run: |
          test -f skills/engineering-standards.md
          test -f skills/security-review.md
          test -f skills/git-handoff.md
          test -f rules/locale-and-standards.mdc
